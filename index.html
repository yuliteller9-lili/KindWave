<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KindWave</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FDF8F3;--surface:#FFFCF9;--card:#FFFFFF;
  --primary:#E8845A;--primary-light:#FDF0E9;--primary-dark:#C4623A;
  --accent:#5A8FE8;--accent-light:#EBF1FD;
  --green:#5AB87A;--green-light:#EBF7EF;
  --text:#2C2419;--text-muted:#7A6A5A;--text-light:#B0A090;
  --border:#EDE0D0;--border-strong:#D4C4B0;
  --danger:#E85A5A;--danger-light:#FDEBEB;
  --warn:#E8B45A;--warn-light:#FDF5E5;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
h1,h2,h3,.display{font-family:'Playfair Display',serif}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;flex-shrink:0}
.sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:22px;color:var(--primary);letter-spacing:-0.5px}
.sidebar-logo p{font-size:11px;color:var(--text-muted);font-family:'DM Sans',sans-serif;margin-top:2px}
.nav{padding:12px 0;flex:1;overflow-y:auto}
.nav-section{padding:8px 16px 4px;font-size:10px;font-weight:600;color:var(--text-light);letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{color:var(--text);background:var(--primary-light)}
.nav-item.active{color:var(--primary);background:var(--primary-light);border-left-color:var(--primary)}
.nav-item .icon{width:16px;text-align:center;font-size:14px}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:18px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-pill{display:flex;align-items:center;gap:8px;background:var(--primary-light);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:500;color:var(--primary-dark)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

.content{flex:1;overflow-y:auto;padding:28px}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-size:15px;font-weight:600;color:var(--text)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#3d9e60}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#c94040}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#3a6fce}
.btn-sm{padding:5px 11px;font-size:12px}

input,textarea,select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:80px}
label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo h1{font-size:32px;color:var(--primary)}
.auth-logo p{color:var(--text-muted);font-size:14px;margin-top:4px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.auth-tab{flex:1;padding:9px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s}
.auth-tab.active{background:var(--primary);color:#fff}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-pending{background:var(--warn-light);color:#8a6010}
.badge-approved{background:var(--green-light);color:#2a7045}
.badge-admin{background:var(--accent-light);color:#1a4a9a}
.badge-denied{background:var(--danger-light);color:#8a2020}
.badge-anon{background:#F0EDE8;color:var(--text-muted)}

.msg-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;position:relative}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.msg-from{font-size:12px;font-weight:600;color:var(--text-muted)}
.msg-to{font-size:12px;color:var(--text-muted)}
.msg-body{font-size:14px;line-height:1.6;color:var(--text)}
.msg-type-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.msg-type-quote{background:var(--accent-light);color:#1a4a9a}
.msg-type-message{background:var(--green-light);color:#2a7045}
.msg-type-media{background:var(--primary-light);color:var(--primary-dark)}
.msg-time{font-size:11px;color:var(--text-light);margin-left:auto}

.quote-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px}
.quote-text{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;color:var(--text);margin-bottom:8px}
.quote-author{font-size:12px;color:var(--text-muted);font-weight:500}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-value{font-size:28px;font-weight:600;font-family:'Playfair Display',serif;color:var(--text)}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px}

.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}
.alert-warn{background:var(--warn-light);color:#7a5010;border:1px solid #f0d090}
.alert-success{background:var(--green-light);color:#2a6040;border:1px solid #90d0a0}
.alert-info{background:var(--accent-light);color:#1a3a8a;border:1px solid #90b0f0}

.empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-icon{font-size:36px;margin-bottom:12px}
.empty p{font-size:14px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mt-4{margin-top:16px}
.gap-2{display:flex;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.text-muted{color:var(--text-muted);font-size:13px}
.separator{border:none;border-top:1px solid var(--border);margin:16px 0}
.hidden{display:none}
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.checkbox-row input[type=checkbox]{width:auto}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;

const ADMIN_EMAIL="admin@kindwave.com";
const ADMIN_PASS="admin123";

const INITIAL_QUOTES=[
  {id:1,text:"You are braver than you believe, stronger than you seem, and smarter than you think.",author:"A.A. Milne",active:true},
  {id:2,text:"In the middle of every difficulty lies opportunity.",author:"Albert Einstein",active:true},
  {id:3,text:"Kindness is the language which the deaf can hear and the blind can see.",author:"Mark Twain",active:true},
  {id:4,text:"The best time to plant a tree was 20 years ago. The second best time is now.",author:"Chinese Proverb",active:true},
  {id:5,text:"You don't have to be great to start, but you have to start to be great.",author:"Zig Ziglar",active:true},
  {id:6,text:"What you do today can improve all your tomorrows.",author:"Ralph Marston",active:true},
];

const SAMPLE_USERS=[
  {id:2,name:"Sarah Chen",email:"sarah@example.com",pass:"pass123",status:"approved",role:"user",joined:"2024-01-15"},
  {id:3,name:"Marcus Webb",email:"marcus@example.com",pass:"pass123",status:"approved",role:"user",joined:"2024-01-18"},
  {id:4,name:"Priya Patel",email:"priya@example.com",pass:"pass123",status:"pending",role:"user",joined:"2024-01-20"},
];

const SAMPLE_MESSAGES=[
  {id:1,fromId:2,toId:3,fromName:"Sarah Chen",toName:"Marcus Webb",anonymous:false,type:"message",content:"Hey Marcus! I just wanted to say your presentation last Tuesday was amazing. The way you explained everything made it so clear for the whole team. Really appreciated it!",timestamp:"2024-01-19 10:23",flagged:false},
  {id:2,fromId:3,toId:2,fromName:"Marcus Webb",toName:"Sarah Chen",anonymous:true,type:"quote",content:"The only way to do great work is to love what you do.",author:"Steve Jobs",timestamp:"2024-01-20 14:15",flagged:false},
];

function useStorage(key,initial){
  const[val,setVal]=useState(()=>{
    try{
      const s=localStorage.getItem(key);
      return s?JSON.parse(s):initial;
    }catch{return initial;}
  });
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(val));}catch{}},[key,val]);
  return[val,setVal];
}

function Avatar({name,size=28}){
  const initials=(name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const colors=['#E8845A','#5A8FE8','#5AB87A','#E85A8F','#8F5AE8','#E8B45A'];
  const color=colors[(name||'').charCodeAt(0)%colors.length];
  return <div style={{width:size,height:size,borderRadius:'50%',background:color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.38,fontWeight:600,flexShrink:0}}>{initials}</div>;
}

function App(){
  const[users,setUsers]=useStorage('kw_users',[
    {id:1,name:"Admin",email:ADMIN_EMAIL,pass:ADMIN_PASS,status:"approved",role:"admin",joined:"2024-01-01"},
    ...SAMPLE_USERS
  ]);
  const[messages,setMessages]=useStorage('kw_messages',SAMPLE_MESSAGES);
  const[quotes,setQuotes]=useStorage('kw_quotes',INITIAL_QUOTES);
  const[session,setSession]=useStorage('kw_session',null);
  const[page,setPage]=useState('home');
  const[authTab,setAuthTab]=useState('login');
  const[loginForm,setLoginForm]=useState({email:'',pass:''});
  const[regForm,setRegForm]=useState({name:'',email:'',pass:''});
  const[authErr,setAuthErr]=useState('');
  const[authOk,setAuthOk]=useState('');

  const currentUser=session?users.find(u=>u.id===session.id):null;
  const isAdmin=currentUser?.role==='admin';
  const pendingCount=users.filter(u=>u.status==='pending').length;

  function login(){
    const u=users.find(u=>u.email===loginForm.email&&u.pass===loginForm.pass);
    if(!u){setAuthErr('Invalid email or password.');return;}
    if(u.status==='pending'){setAuthErr('Your account is awaiting admin approval.');return;}
    if(u.status==='denied'){setAuthErr('Your account has been denied.');return;}
    setSession({id:u.id});setAuthErr('');setPage('home');
  }
  function register(){
    if(!regForm.name||!regForm.email||!regForm.pass){setAuthErr('All fields required.');return;}
    if(users.find(u=>u.email===regForm.email)){setAuthErr('Email already registered.');return;}
    const nu={id:Date.now(),name:regForm.name,email:regForm.email,pass:regForm.pass,status:'pending',role:'user',joined:new Date().toISOString().split('T')[0]};
    setUsers(prev=>[...prev,nu]);
    setAuthOk('Account created! Please wait for admin approval before logging in.');
    setRegForm({name:'',email:'',pass:''});
    setAuthTab('login');
    setAuthErr('');
  }
  function logout(){setSession(null);setPage('home');}

  if(!currentUser){
    return(
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-logo">
            <h1>🌊 KindWave</h1>
            <p>Spread positivity, one wave at a time</p>
          </div>
          {authErr&&<div className="alert alert-warn">{authErr}</div>}
          {authOk&&<div className="alert alert-success">{authOk}</div>}
          <div className="auth-tabs">
            <div className={`auth-tab ${authTab==='login'?'active':''}`} onClick={()=>{setAuthTab('login');setAuthErr('');setAuthOk('');}}>Sign In</div>
            <div className={`auth-tab ${authTab==='register'?'active':''}`} onClick={()=>{setAuthTab('register');setAuthErr('');setAuthOk('');}}>Create Account</div>
          </div>
          {authTab==='login'?(
            <>
              <div className="form-group"><label>Email</label><input type="email" value={loginForm.email} onChange={e=>setLoginForm(p=>({...p,email:e.target.value}))} placeholder="you@example.com"/></div>
              <div className="form-group"><label>Password</label><input type="password" value={loginForm.pass} onChange={e=>setLoginForm(p=>({...p,pass:e.target.value}))} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&login()}/></div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={login}>Sign In</button>
              <p className="text-muted" style={{textAlign:'center',marginTop:12,fontSize:12}}>Admin: admin@kindwave.com / admin123</p>
            </>
          ):(
            <>
              <div className="form-group"><label>Your Name</label><input value={regForm.name} onChange={e=>setRegForm(p=>({...p,name:e.target.value}))} placeholder="Jane Smith"/></div>
              <div className="form-group"><label>Email</label><input type="email" value={regForm.email} onChange={e=>setRegForm(p=>({...p,email:e.target.value}))} placeholder="you@example.com"/></div>
              <div className="form-group"><label>Password</label><input type="password" value={regForm.pass} onChange={e=>setRegForm(p=>({...p,pass:e.target.value}))} placeholder="Choose a password"/></div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={register}>Request Account</button>
              <p className="text-muted" style={{textAlign:'center',marginTop:10,fontSize:12}}>An admin will approve your account.</p>
            </>
          )}
        </div>
      </div>
    );
  }

  return(
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo">
          <h1>🌊 KindWave</h1>
          <p>Positivity platform</p>
        </div>
        <nav className="nav">
          <div className="nav-section">Main</div>
          <div className={`nav-item ${page==='home'?'active':''}`} onClick={()=>setPage('home')}><span className="icon">🏠</span>Home</div>
          <div className={`nav-item ${page==='send'?'active':''}`} onClick={()=>setPage('send')}><span className="icon">💌</span>Send Kindness</div>
          <div className={`nav-item ${page==='inbox'?'active':''}`} onClick={()=>setPage('inbox')}><span className="icon">📬</span>My Inbox</div>
          <div className={`nav-item ${page==='inspiration'?'active':''}`} onClick={()=>setPage('inspiration')}><span className="icon">✨</span>Inspiration</div>
          {isAdmin&&<>
            <div className="nav-section">Admin</div>
            <div className={`nav-item ${page==='admin-users'?'active':''}`} onClick={()=>setPage('admin-users')}><span className="icon">👥</span>Users{pendingCount>0&&<span className="nav-badge">{pendingCount}</span>}</div>
            <div className={`nav-item ${page==='admin-messages'?'active':''}`} onClick={()=>setPage('admin-messages')}><span className="icon">📋</span>All Messages</div>
            <div className={`nav-item ${page==='admin-quotes'?'active':''}`} onClick={()=>setPage('admin-quotes')}><span className="icon">💬</span>Manage Quotes</div>
          </>}
        </nav>
        <div style={{padding:'12px 20px 20px',borderTop:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
            <Avatar name={currentUser.name}/>
            <div><div style={{fontSize:13,fontWeight:600}}>{currentUser.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{currentUser.role==='admin'?'Admin':'Member'}</div></div>
          </div>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={logout}>Sign Out</button>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div className="topbar-title">
            {page==='home'&&'Home'}
            {page==='send'&&'Send Kindness'}
            {page==='inbox'&&'My Inbox'}
            {page==='inspiration'&&'Inspiration'}
            {page==='admin-users'&&'User Management'}
            {page==='admin-messages'&&'All Messages (Admin)'}
            {page==='admin-quotes'&&'Manage Quotes'}
          </div>
          <div className="topbar-right">
            {isAdmin&&<span className="badge badge-admin">Admin</span>}
            <Avatar name={currentUser.name}/>
          </div>
        </div>
        <div className="content">
          {page==='home'&&<HomePage currentUser={currentUser} messages={messages} users={users} quotes={quotes} setPage={setPage}/>}
          {page==='send'&&<SendPage currentUser={currentUser} users={users} quotes={quotes} setMessages={setMessages} setPage={setPage}/>}
          {page==='inbox'&&<InboxPage currentUser={currentUser} messages={messages} users={users}/>}
          {page==='inspiration'&&<InspirationPage quotes={quotes.filter(q=>q.active)}/>}
          {page==='admin-users'&&isAdmin&&<AdminUsersPage users={users} setUsers={setUsers} currentUser={currentUser}/>}
          {page==='admin-messages'&&isAdmin&&<AdminMessagesPage messages={messages} users={users} setMessages={setMessages}/>}
          {page==='admin-quotes'&&isAdmin&&<AdminQuotesPage quotes={quotes} setQuotes={setQuotes}/>}
        </div>
      </div>
    </div>
  );
}

function HomePage({currentUser,messages,users,quotes,setPage}){
  const myMessages=messages.filter(m=>m.toId===currentUser.id);
  const activeQ=quotes.filter(q=>q.active);
  const randomQ=activeQ[Math.floor(Math.random()*activeQ.length)];
  return(
    <div>
      <div style={{marginBottom:24}}>
        <h2 style={{fontSize:22,fontWeight:400,color:'var(--text)',marginBottom:4}}>Welcome back, <span style={{color:'var(--primary)'}}>{currentUser.name.split(' ')[0]}</span> 🌊</h2>
        <p className="text-muted">Spread some positivity today.</p>
      </div>
      <div className="stats-grid">
        <div className="stat-card"><div className="stat-value">{myMessages.length}</div><div className="stat-label">Kind messages received</div></div>
        <div className="stat-card"><div className="stat-value">{messages.filter(m=>m.fromId===currentUser.id).length}</div><div className="stat-label">Kindness sent</div></div>
        <div className="stat-card"><div className="stat-value">{quotes.filter(q=>q.active).length}</div><div className="stat-label">Inspiration quotes</div></div>
      </div>
      {randomQ&&(
        <div className="card" style={{marginBottom:20,background:'var(--primary-light)',border:'1px solid var(--border)'}}>
          <div style={{fontSize:11,fontWeight:600,color:'var(--primary)',letterSpacing:1,textTransform:'uppercase',marginBottom:10}}>✨ Quote of the moment</div>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:17,lineHeight:1.6,color:'var(--text)',marginBottom:8}}>"{randomQ.text}"</div>
          <div style={{fontSize:12,color:'var(--text-muted)',fontWeight:500}}>— {randomQ.author}</div>
        </div>
      )}
      <div className="grid-2">
        <div className="card">
          <div className="card-header"><div className="card-title">Recent for you</div></div>
          {myMessages.length===0?<div className="empty"><div className="empty-icon">💌</div><p>No messages yet</p></div>:
            myMessages.slice(-3).reverse().map(m=>(
              <div key={m.id} className="msg-card">
                <div className="msg-meta">
                  <span className="msg-from">From: {m.anonymous?'Someone special 🎭':m.fromName}</span>
                  <span className={`msg-type-badge msg-type-${m.type}`}>{m.type}</span>
                  <span className="msg-time">{m.timestamp}</span>
                </div>
                <div className="msg-body">{m.type==='quote'?`"${m.content}" — ${m.author||''}`:m.content}</div>
              </div>
            ))
          }
        </div>
        <div className="card">
          <div className="card-header"><div className="card-title">Quick actions</div></div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <button className="btn btn-primary" style={{justifyContent:'center'}} onClick={()=>setPage('send')}>💌 Send Kindness</button>
            <button className="btn btn-ghost" style={{justifyContent:'center'}} onClick={()=>setPage('inbox')}>📬 View Inbox</button>
            <button className="btn btn-ghost" style={{justifyContent:'center'}} onClick={()=>setPage('inspiration')}>✨ Get Inspired</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SendPage({currentUser,users,quotes,setMessages,setPage}){
  const[step,setStep]=useState(1);
  const[form,setForm]=useState({toId:'',anonymous:false,type:'message',content:'',author:'',mediaUrl:''});
  const[sent,setSent]=useState(false);
  const[selectedQuote,setSelectedQuote]=useState(null);
  const[quoteFilter,setQuoteFilter]=useState('');

  const approvedUsers=users.filter(u=>u.status==='approved'&&u.id!==currentUser.id);
  const activeQuotes=quotes.filter(q=>q.active&&q.text.toLowerCase().includes(quoteFilter.toLowerCase()));

  function send(){
    if(!form.toId){return;}
    const toUser=users.find(u=>u.id===parseInt(form.toId));
    const nm={
      id:Date.now(),fromId:currentUser.id,toId:parseInt(form.toId),
      fromName:currentUser.name,toName:toUser?.name||'',
      anonymous:form.anonymous,type:form.type,
      content:form.type==='quote'?(selectedQuote?.text||form.content):form.content,
      author:form.type==='quote'?(selectedQuote?.author||form.author):'',
      mediaUrl:form.type==='media'?form.mediaUrl:'',
      timestamp:new Date().toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
      flagged:false
    };
    setMessages(prev=>[...prev,nm]);
    setSent(true);
  }

  if(sent){
    return(
      <div style={{textAlign:'center',padding:'60px 20px'}}>
        <div style={{fontSize:52,marginBottom:16}}>🌊</div>
        <h2 style={{fontSize:24,fontWeight:400,marginBottom:8}}>Your wave of kindness was sent!</h2>
        <p className="text-muted" style={{marginBottom:24}}>You made someone's day a little brighter.</p>
        <div className="gap-2" style={{justifyContent:'center'}}>
          <button className="btn btn-primary" onClick={()=>{setSent(false);setForm({toId:'',anonymous:false,type:'message',content:'',author:'',mediaUrl:''});setSelectedQuote(null);setStep(1);}}>Send Another</button>
          <button className="btn btn-ghost" onClick={()=>setPage('home')}>Go Home</button>
        </div>
      </div>
    );
  }

  return(
    <div style={{maxWidth:560}}>
      <div className="card">
        <div style={{display:'flex',gap:8,marginBottom:24}}>
          {[1,2,3].map(s=>(
            <div key={s} style={{flex:1,height:4,borderRadius:2,background:step>=s?'var(--primary)':'var(--border)',transition:'background .3s'}}/>
          ))}
        </div>

        {step===1&&(
          <>
            <h3 style={{marginBottom:4}}>Who are you sending to?</h3>
            <p className="text-muted" style={{marginBottom:20,fontSize:13}}>Choose a recipient and whether to stay anonymous.</p>
            <div className="form-group">
              <label>Recipient</label>
              <select value={form.toId} onChange={e=>setForm(p=>({...p,toId:e.target.value}))}>
                <option value="">Select someone...</option>
                {approvedUsers.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
            </div>
            <label className="checkbox-row" style={{marginBottom:20}}>
              <input type="checkbox" checked={form.anonymous} onChange={e=>setForm(p=>({...p,anonymous:e.target.checked}))}/> 
              <span style={{fontSize:13}}>Send anonymously <span style={{color:'var(--text-muted)'}}>(they won't know it's you)</span></span>
            </label>
            <button className="btn btn-primary" disabled={!form.toId} onClick={()=>setStep(2)}>Next →</button>
          </>
        )}

        {step===2&&(
          <>
            <h3 style={{marginBottom:4}}>What are you sending?</h3>
            <p className="text-muted" style={{marginBottom:20,fontSize:13}}>Choose the type of kindness to share.</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:24}}>
              {[
                {type:'message',icon:'💬',label:'Message',desc:'A personal note or appreciation'},
                {type:'quote',icon:'✨',label:'Quote',desc:'An inspiring quote'},
                {type:'media',icon:'🎉',label:'Media / GIF',desc:'A funny or uplifting link'},
              ].map(t=>(
                <div key={t.type} onClick={()=>setForm(p=>({...p,type:t.type}))} style={{border:`2px solid ${form.type===t.type?'var(--primary)':'var(--border)'}`,borderRadius:12,padding:14,cursor:'pointer',textAlign:'center',background:form.type===t.type?'var(--primary-light)':'var(--surface)',transition:'all .15s'}}>
                  <div style={{fontSize:22,marginBottom:6}}>{t.icon}</div>
                  <div style={{fontSize:13,fontWeight:600,marginBottom:3}}>{t.label}</div>
                  <div style={{fontSize:11,color:'var(--text-muted)'}}>{t.desc}</div>
                </div>
              ))}
            </div>
            <div className="gap-2">
              <button className="btn btn-ghost" onClick={()=>setStep(1)}>← Back</button>
              <button className="btn btn-primary" onClick={()=>setStep(3)}>Next →</button>
            </div>
          </>
        )}

        {step===3&&(
          <>
            <h3 style={{marginBottom:4}}>Write your message</h3>
            <p className="text-muted" style={{marginBottom:20,fontSize:13}}>
              Sending to <strong>{users.find(u=>u.id===parseInt(form.toId))?.name}</strong>
              {form.anonymous?' anonymously':''}
            </p>

            {form.type==='message'&&(
              <div className="form-group">
                <label>Your message</label>
                <textarea value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="Share something positive, an appreciation, or an uplifting thought..." style={{minHeight:120}}/>
              </div>
            )}

            {form.type==='quote'&&(
              <>
                <div className="form-group">
                  <label>Search quotes</label>
                  <input value={quoteFilter} onChange={e=>setQuoteFilter(e.target.value)} placeholder="Filter quotes..."/>
                </div>
                <div style={{maxHeight:200,overflowY:'auto',marginBottom:12,border:'1px solid var(--border)',borderRadius:10}}>
                  {activeQuotes.length===0?<div style={{padding:16,textAlign:'center',color:'var(--text-muted)',fontSize:13}}>No quotes found</div>:
                    activeQuotes.map(q=>(
                      <div key={q.id} onClick={()=>{setSelectedQuote(q);setForm(p=>({...p,content:q.text,author:q.author}));}} style={{padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid var(--border)',background:selectedQuote?.id===q.id?'var(--primary-light)':'',transition:'background .1s'}}>
                        <div style={{fontSize:13,fontStyle:'italic',marginBottom:2}}>"{q.text}"</div>
                        <div style={{fontSize:11,color:'var(--text-muted)'}}>— {q.author}</div>
                      </div>
                    ))
                  }
                </div>
                <p className="text-muted" style={{fontSize:12,marginBottom:12}}>Or write your own:</p>
                <div className="form-group"><label>Quote text</label><textarea value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="Type a quote..."/></div>
                <div className="form-group"><label>Author</label><input value={form.author} onChange={e=>setForm(p=>({...p,author:e.target.value}))} placeholder="Author name"/></div>
              </>
            )}

            {form.type==='media'&&(
              <>
                <div className="form-group">
                  <label>Link (GIF, image, video, meme)</label>
                  <input value={form.mediaUrl} onChange={e=>setForm(p=>({...p,mediaUrl:e.target.value}))} placeholder="https://..."/>
                </div>
                <div className="form-group">
                  <label>Add a note (optional)</label>
                  <textarea value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="Add a message to go with it..." style={{minHeight:70}}/>
                </div>
                {form.mediaUrl&&(form.mediaUrl.includes('.gif')||form.mediaUrl.includes('giphy')||form.mediaUrl.includes('.jpg')||form.mediaUrl.includes('.png'))&&(
                  <div style={{marginBottom:12}}><img src={form.mediaUrl} alt="preview" style={{maxWidth:'100%',maxHeight:160,borderRadius:8,objectFit:'cover'}} onError={e=>e.target.style.display='none'}/></div>
                )}
              </>
            )}

            <div className="gap-2">
              <button className="btn btn-ghost" onClick={()=>setStep(2)}>← Back</button>
              <button className="btn btn-primary" disabled={!form.content&&!form.mediaUrl} onClick={send}>🌊 Send Wave</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function InboxPage({currentUser,messages,users}){
  const[tab,setTab]=useState('received');
  const received=messages.filter(m=>m.toId===currentUser.id).reverse();
  const sent=messages.filter(m=>m.fromId===currentUser.id).reverse();
  const list=tab==='received'?received:sent;

  return(
    <div>
      <div className="tabs">
        <div className={`tab ${tab==='received'?'active':''}`} onClick={()=>setTab('received')}>Received ({received.length})</div>
        <div className={`tab ${tab==='sent'?'active':''}`} onClick={()=>setTab('sent')}>Sent ({sent.length})</div>
      </div>
      {list.length===0?<div className="empty"><div className="empty-icon">{tab==='received'?'💌':'🌊'}</div><p>{tab==='received'?'No messages received yet':'You haven\'t sent any messages yet'}</p></div>:
        list.map(m=>(
          <div key={m.id} className="msg-card">
            <div className="msg-meta">
              {tab==='received'?<span className="msg-from">From: {m.anonymous?<span>Someone special 🎭</span>:m.fromName}</span>:<span className="msg-from">To: {m.toName}</span>}
              <span className={`msg-type-badge msg-type-${m.type}`}>{m.type}</span>
              <span className="msg-time">{m.timestamp}</span>
              {tab==='sent'&&m.anonymous&&<span className="badge badge-anon" style={{fontSize:10}}>sent anonymously</span>}
            </div>
            <div className="msg-body">
              {m.type==='quote'?<em>"{m.content}" {m.author&&`— ${m.author}`}</em>:m.content}
              {m.mediaUrl&&<div style={{marginTop:8}}><a href={m.mediaUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--accent)',fontSize:13}}>🔗 View media</a></div>}
            </div>
          </div>
        ))
      }
    </div>
  );
}

function InspirationPage({quotes}){
  const[featured,setFeatured]=useState(()=>quotes[Math.floor(Math.random()*quotes.length)]);
  return(
    <div>
      {featured&&(
        <div className="card" style={{background:'var(--primary-light)',borderColor:'var(--primary)',marginBottom:24,padding:28,textAlign:'center'}}>
          <div style={{fontSize:11,fontWeight:600,color:'var(--primary)',letterSpacing:1,textTransform:'uppercase',marginBottom:14}}>✨ Featured Quote</div>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:22,lineHeight:1.6,color:'var(--text)',marginBottom:12}}>"{featured.text}"</div>
          <div style={{fontSize:13,color:'var(--text-muted)',fontWeight:500}}>— {featured.author}</div>
          <button className="btn btn-ghost btn-sm" style={{marginTop:16}} onClick={()=>setFeatured(quotes[Math.floor(Math.random()*quotes.length)])}>Shuffle ↻</button>
        </div>
      )}
      <h3 style={{marginBottom:16,fontSize:15,fontWeight:600}}>All Quotes ({quotes.length})</h3>
      <div style={{columns:2,columnGap:16}}>
        {quotes.map(q=>(
          <div key={q.id} className="quote-card" style={{breakInside:'avoid',marginBottom:12}}>
            <div className="quote-text">"{q.text}"</div>
            <div className="quote-author">— {q.author}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AdminUsersPage({users,setUsers,currentUser}){
  const[tab,setTab]=useState('pending');
  const filtered=users.filter(u=>u.id!==1&&(tab==='all'||u.status===tab));

  function approve(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,status:'approved'}:u));}
  function deny(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,status:'denied'}:u));}
  function makeAdmin(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,role:'admin'}:u));}
  function removeAdmin(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,role:'user'}:u));}

  return(
    <div>
      <div className="tabs">
        <div className={`tab ${tab==='pending'?'active':''}`} onClick={()=>setTab('pending')}>Pending ({users.filter(u=>u.status==='pending').length})</div>
        <div className={`tab ${tab==='approved'?'active':''}`} onClick={()=>setTab('approved')}>Approved</div>
        <div className={`tab ${tab==='denied'?'active':''}`} onClick={()=>setTab('denied')}>Denied</div>
        <div className={`tab ${tab==='all'?'active':''}`} onClick={()=>setTab('all')}>All</div>
      </div>
      {filtered.length===0?<div className="empty"><div className="empty-icon">👥</div><p>No users in this category</p></div>:(
        <div className="card">
          <div className="table-wrap">
            <table>
              <thead><tr><th>User</th><th>Email</th><th>Joined</th><th>Status</th><th>Role</th><th>Actions</th></tr></thead>
              <tbody>
                {filtered.map(u=>(
                  <tr key={u.id}>
                    <td><div style={{display:'flex',alignItems:'center',gap:10}}><Avatar name={u.name} size={32}/><span style={{fontWeight:500}}>{u.name}</span></div></td>
                    <td style={{color:'var(--text-muted)'}}>{u.email}</td>
                    <td style={{color:'var(--text-muted)',fontSize:12}}>{u.joined}</td>
                    <td><span className={`badge badge-${u.status}`}>{u.status}</span></td>
                    <td><span className={`badge ${u.role==='admin'?'badge-admin':'badge-anon'}`}>{u.role}</span></td>
                    <td>
                      <div className="gap-2">
                        {u.status==='pending'&&<><button className="btn btn-success btn-sm" onClick={()=>approve(u.id)}>✓ Approve</button><button className="btn btn-danger btn-sm" onClick={()=>deny(u.id)}>✗ Deny</button></>}
                        {u.status==='denied'&&<button className="btn btn-ghost btn-sm" onClick={()=>approve(u.id)}>Approve</button>}
                        {u.status==='approved'&&u.role!=='admin'&&u.id!==currentUser.id&&<button className="btn btn-accent btn-sm" onClick={()=>makeAdmin(u.id)}>Make Admin</button>}
                        {u.role==='admin'&&u.id!==currentUser.id&&<button className="btn btn-ghost btn-sm" onClick={()=>removeAdmin(u.id)}>Remove Admin</button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminMessagesPage({messages,users,setMessages}){
  const[filter,setFilter]=useState('');
  const filtered=messages.filter(m=>{
    const s=filter.toLowerCase();
    return !s||m.fromName.toLowerCase().includes(s)||m.toName.toLowerCase().includes(s)||m.content.toLowerCase().includes(s);
  }).slice().reverse();

  return(
    <div>
      <div className="alert alert-info" style={{marginBottom:16}}>👁️ As admin, you can see all messages including anonymous senders.</div>
      <div style={{marginBottom:16}}><input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Search by name or content..."/></div>
      {filtered.length===0?<div className="empty"><div className="empty-icon">📋</div><p>No messages found</p></div>:
        filtered.map(m=>(
          <div key={m.id} className="msg-card" style={{borderLeft:m.anonymous?'3px solid var(--accent)':'3px solid var(--green)'}}>
            <div className="msg-meta">
              <Avatar name={m.fromName} size={22}/>
              <span className="msg-from" style={{fontWeight:600}}>{m.fromName}</span>
              {m.anonymous&&<span className="badge badge-anon" style={{fontSize:10}}>sent anonymously</span>}
              <span style={{fontSize:12,color:'var(--text-muted)'}}>→</span>
              <Avatar name={m.toName} size={22}/>
              <span className="msg-to" style={{fontWeight:600}}>{m.toName}</span>
              <span className={`msg-type-badge msg-type-${m.type}`}>{m.type}</span>
              <span className="msg-time">{m.timestamp}</span>
            </div>
            <div className="msg-body">
              {m.type==='quote'?<em>"{m.content}" {m.author&&`— ${m.author}`}</em>:m.content}
              {m.mediaUrl&&<div style={{marginTop:6}}><span style={{color:'var(--text-muted)',fontSize:12}}>Media: </span><a href={m.mediaUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--accent)',fontSize:12}}>{m.mediaUrl}</a></div>}
            </div>
          </div>
        ))
      }
    </div>
  );
}

function AdminQuotesPage({quotes,setQuotes}){
  const[form,setForm]=useState({text:'',author:''});
  const[editing,setEditing]=useState(null);
  const[err,setErr]=useState('');

  function addQuote(){
    if(!form.text||!form.author){setErr('Both fields required.');return;}
    setQuotes(prev=>[...prev,{id:Date.now(),text:form.text,author:form.author,active:true}]);
    setForm({text:'',author:''});setErr('');
  }
  function toggleActive(id){setQuotes(prev=>prev.map(q=>q.id===id?{...q,active:!q.active}:q));}
  function deleteQuote(id){setQuotes(prev=>prev.filter(q=>q.id!==id));}
  function saveEdit(){
    setQuotes(prev=>prev.map(q=>q.id===editing.id?{...q,...editing}:q));
    setEditing(null);
  }

  return(
    <div>
      <div className="grid-2" style={{marginBottom:24}}>
        <div className="card">
          <div className="card-title" style={{marginBottom:14}}>Add New Quote</div>
          {err&&<div className="alert alert-warn">{err}</div>}
          <div className="form-group"><label>Quote Text</label><textarea value={form.text} onChange={e=>setForm(p=>({...p,text:e.target.value}))} placeholder="Enter the quote..."/></div>
          <div className="form-group"><label>Author</label><input value={form.author} onChange={e=>setForm(p=>({...p,author:e.target.value}))} placeholder="Author name"/></div>
          <button className="btn btn-primary" onClick={addQuote}>+ Add Quote</button>
        </div>
        <div className="card">
          <div className="card-title" style={{marginBottom:14}}>Stats</div>
          <div className="stat-card" style={{marginBottom:10}}><div className="stat-value">{quotes.length}</div><div className="stat-label">Total quotes</div></div>
          <div className="stat-card"><div className="stat-value">{quotes.filter(q=>q.active).length}</div><div className="stat-label">Active / visible to users</div></div>
        </div>
      </div>

      {editing&&(
        <div className="card" style={{marginBottom:16,borderColor:'var(--primary)',background:'var(--primary-light)'}}>
          <div className="card-title" style={{marginBottom:12}}>Editing Quote</div>
          <div className="form-group"><label>Quote Text</label><textarea value={editing.text} onChange={e=>setEditing(p=>({...p,text:e.target.value}))}/></div>
          <div className="form-group"><label>Author</label><input value={editing.author} onChange={e=>setEditing(p=>({...p,author:e.target.value}))}/></div>
          <div className="gap-2"><button className="btn btn-primary" onClick={saveEdit}>Save Changes</button><button className="btn btn-ghost" onClick={()=>setEditing(null)}>Cancel</button></div>
        </div>
      )}

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Quote</th><th>Author</th><th>Visible</th><th>Actions</th></tr></thead>
            <tbody>
              {quotes.map(q=>(
                <tr key={q.id}>
                  <td style={{maxWidth:300,fontStyle:'italic',fontSize:13}}>"{q.text.slice(0,80)}{q.text.length>80?'...':''}"</td>
                  <td style={{color:'var(--text-muted)',fontSize:13}}>{q.author}</td>
                  <td><span className={`badge ${q.active?'badge-approved':'badge-denied'}`}>{q.active?'Active':'Hidden'}</span></td>
                  <td>
                    <div className="gap-2">
                      <button className="btn btn-ghost btn-sm" onClick={()=>setEditing({...q})}>Edit</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>toggleActive(q.id)}>{q.active?'Hide':'Show'}</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>deleteQuote(q.id)}>Delete</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
