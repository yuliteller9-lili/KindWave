<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KindWave</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FEF7FD;--surface:#FFF9FE;--card:#FFFFFF;
  --primary:#C888BE;--primary-light:#FAF0F8;--primary-dark:#9E66A0;
  --accent:#A890D0;--accent-light:#F3EFFC;
  --pink:#DFA8C8;--pink-light:#FEF2F8;
  --green:#6DB87A;--green-light:#EBF7EF;
  --text:#3A2040;--text-muted:#907898;--text-light:#C8B0C8;
  --border:#F2DDEF;--border-strong:#DEB8DC;
  --danger:#C87888;--danger-light:#FEF2F4;
  --warn:#C8985A;--warn-light:#FDF4E5;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;overflow-x:hidden}
h1,h2,h3{font-family:'Playfair Display',serif}
.app{display:flex;height:100vh;overflow:hidden;position:relative;z-index:2}
.sidebar{width:230px;background:linear-gradient(180deg,rgba(255,248,253,0.92) 0%,rgba(252,240,255,0.92) 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;backdrop-filter:blur(12px)}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:22px;color:var(--primary);letter-spacing:-0.5px}
.sidebar-logo p{font-size:11px;color:var(--text-muted);margin-top:2px}
.nav{padding:14px 0;flex:1;overflow-y:auto}
.nav-section{padding:8px 18px 4px;font-size:10px;font-weight:700;color:var(--text-light);letter-spacing:1.2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);border-left:3px solid transparent;border-radius:0 10px 10px 0;margin:1px 8px 1px 0;transition:all .15s}
.nav-item:hover{color:var(--primary);background:var(--primary-light)}
.nav-item.active{color:var(--primary-dark);background:var(--primary-light);border-left-color:var(--primary)}
.nav-item .icon{width:18px;text-align:center;font-size:15px}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:transparent}
.topbar{background:rgba(255,251,253,0.90);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;backdrop-filter:blur(12px)}
.topbar-title{font-size:18px;font-weight:700;color:var(--text);font-family:'Playfair Display',serif}
.topbar-right{display:flex;align-items:center;gap:12px}
.content{flex:1;overflow-y:auto;padding:28px;background:transparent}
.card{background:rgba(255,255,255,0.88);border:1px solid var(--border);border-radius:18px;padding:20px;backdrop-filter:blur(4px)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-size:15px;font-weight:700;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:50px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:'Nunito',sans-serif}
.btn-primary{background:linear-gradient(135deg,#C888BE,#DFA8C8);color:#fff;box-shadow:0 2px 10px rgba(200,136,190,0.28)}.btn-primary:hover{box-shadow:0 4px 16px rgba(200,136,190,0.38);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;transform:none;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--primary-light);border-color:var(--border-strong)}
.btn-success{background:linear-gradient(135deg,var(--green),#4aa860);color:#fff}.btn-success:hover{opacity:.9}
.btn-danger{background:linear-gradient(135deg,var(--danger),#a05068);color:#fff}.btn-danger:hover{opacity:.9}
.btn-accent{background:linear-gradient(135deg,var(--accent),#8870b8);color:#fff}.btn-accent:hover{opacity:.9}
.btn-sm{padding:5px 14px;font-size:12px}
input,textarea,select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:13px;font-family:'Nunito',sans-serif;background:rgba(255,255,255,0.85);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(200,136,190,0.12)}
textarea{resize:vertical;min-height:80px}
label{font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.6px}
.form-group{margin-bottom:14px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:2}
.auth-card{background:rgba(255,255,255,0.92);border:1px solid var(--border);border-radius:24px;padding:38px 34px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(200,136,190,0.13);backdrop-filter:blur(12px)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo h1{font-size:34px;color:var(--primary)}
.auth-logo p{color:var(--text-muted);font-size:14px;margin-top:4px}
.auth-tabs{display:flex;margin-bottom:24px;background:var(--bg);border-radius:50px;padding:3px}
.auth-tab{flex:1;padding:9px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-muted);border-radius:50px;transition:all .2s}
.auth-tab.active{background:linear-gradient(135deg,#C888BE,#DFA8C8);color:#fff;box-shadow:0 2px 8px rgba(200,136,190,0.28)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--primary-light)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-pending{background:var(--warn-light);color:#8a6010}
.badge-approved{background:var(--green-light);color:#2a7045}
.badge-admin{background:var(--accent-light);color:#5a3090}
.badge-denied{background:var(--danger-light);color:#8a2040}
.badge-anon{background:var(--primary-light);color:var(--primary-dark)}
.msg-card{background:rgba(255,255,255,0.88);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.msg-from{font-size:12px;font-weight:700;color:var(--text-muted)}
.msg-body{font-size:14px;line-height:1.65;color:var(--text)}
.msg-type-badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700}
.msg-type-quote{background:var(--accent-light);color:#5a3090}
.msg-type-message{background:var(--green-light);color:#2a7045}
.msg-type-media{background:var(--pink-light);color:#8a3060}
.msg-time{font-size:11px;color:var(--text-light);margin-left:auto}
.quote-card{background:rgba(255,255,255,0.88);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:12px}
.quote-text{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;color:var(--text);margin-bottom:8px;font-style:italic}
.quote-author{font-size:12px;color:var(--text-muted);font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:linear-gradient(135deg,rgba(255,255,255,0.92),rgba(255,244,251,0.92));border:1px solid var(--border);border-radius:16px;padding:18px}
.stat-value{font-size:30px;font-weight:700;font-family:'Playfair Display',serif;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:600}
.alert{padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;font-weight:600}
.alert-warn{background:var(--warn-light);color:#7a5010;border:1px solid #f0d090}
.alert-success{background:var(--green-light);color:#2a6040;border:1px solid #90d0a0}
.alert-info{background:var(--accent-light);color:#4a2080;border:1px solid #c0a0f0}
.empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px;font-weight:600}
.tabs{display:flex;border-bottom:1.5px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s;border-radius:8px 8px 0 0}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
.tab:hover{color:var(--primary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gap-2{display:flex;gap:8px;flex-wrap:wrap}
.text-muted{color:var(--text-muted);font-size:13px}
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.checkbox-row input[type=checkbox]{width:auto}
.upload-area{border:2px dashed var(--border-strong);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--primary-light)}
.upload-area:hover{border-color:var(--primary);background:rgba(200,136,190,0.08)}
.upload-area.dragover{border-color:var(--primary);background:rgba(200,136,190,0.12)}
.upload-area.has-file{border-style:solid;border-color:var(--primary)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(200,136,190,0.3);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-screen h2{font-size:22px;font-weight:400;color:var(--primary)}

/* ── Mobile responsive with hamburger ── */
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;border-radius:8px;background:none;border:none;z-index:200}
.hamburger span{display:block;width:22px;height:2px;background:var(--primary);border-radius:2px;transition:all .25s}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(58,32,64,0.35);z-index:98;backdrop-filter:blur(2px)}
.mobile-overlay.open{display:block}

@media (max-width: 768px) {
  .hamburger{display:flex}
  .sidebar{position:fixed;top:0;left:-260px;height:100vh;width:240px;z-index:99;transition:left .28s cubic-bezier(.4,0,.2,1);box-shadow:none}
  .sidebar.open{left:0;box-shadow:4px 0 24px rgba(200,136,190,0.18)}
  .app{flex-direction:column}
  .main{width:100%;min-width:0}
  .topbar{padding:0 12px;height:54px;position:sticky;top:0;z-index:50}
  .topbar-title{font-size:15px}
  .content{padding:16px}
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-card{padding:12px}
  .stat-value{font-size:22px}
  .stat-label{font-size:10px}
  .grid-2{grid-template-columns:1fr}
  .card{border-radius:14px;padding:14px}
  .auth-card{padding:28px 20px;border-radius:18px;margin:0 4px}
  .auth-logo h1{font-size:28px}
  .btn{padding:8px 14px;font-size:13px}
  .btn-sm{padding:4px 10px;font-size:11px}
  .gap-2{gap:6px;flex-wrap:wrap}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab{white-space:nowrap;padding:8px 14px;font-size:12px}
  .msg-card{padding:12px}
  .upload-area{padding:20px 12px}
  .quote-text{font-size:14px}
  .table-wrap{overflow-x:auto}
  table{font-size:12px;min-width:500px}
  th,td{padding:8px 10px}
  .alert{font-size:12px;padding:10px 14px}
  .empty{padding:32px 16px}
  input,textarea,select{font-size:16px}
}
@media (max-width: 400px) {
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card:last-child{grid-column:span 2}
}
</style>
</head>

function Avatar({name,size=28}){
  const initials=(name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const colors=['#C888BE','#A890D0','#DFA8C8','#6DB87A','#C8985A','#5A9BD4'];
  const color=colors[(name||'').charCodeAt(0)%colors.length];
  return <div style={{width:size,height:size,borderRadius:'50%',background:color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.38,fontWeight:700,flexShrink:0,border:'2px solid rgba(255,255,255,0.7)'}}>{initials}</div>;
}

/* ── Firebase helpers ── */
async function fbGetUsers(){
  const{collection,getDocs}=window._fs;
  const snap=await getDocs(collection(window._db,'users'));
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function fbSetUser(id,data){
  const{doc,setDoc}=window._fs;
  await setDoc(doc(window._db,'users',id),data,{merge:true});
}
async function fbDeleteUser(id){
  const{doc,deleteDoc}=window._fs;
  await deleteDoc(doc(window._db,'users',id));
}
async function fbDeleteMessage(id){
  const{doc,deleteDoc}=window._fs;
  await deleteDoc(doc(window._db,'messages',id));
}
async function fbAddMessage(data){
  const{collection,addDoc,serverTimestamp}=window._fs;
  await addDoc(collection(window._db,'messages'),{...data,createdAt:serverTimestamp()});
}
async function fbGetQuotes(){
  const{collection,getDocs}=window._fs;
  const snap=await getDocs(collection(window._db,'quotes'));
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function fbSetQuote(id,data){
  const{doc,setDoc}=window._fs;
  await setDoc(doc(window._db,'quotes',id),data,{merge:true});
}
async function fbAddQuote(data){
  const{collection,addDoc}=window._fs;
  const ref=await addDoc(collection(window._db,'quotes'),data);
  return ref.id;
}
async function fbDeleteQuote(id){
  const{doc,deleteDoc}=window._fs;
  await deleteDoc(doc(window._db,'quotes',id));
}

function App(){
  const[ready,setReady]=useState(!!window._fbReady);
  const[session,setSession]=useState(()=>{try{const s=localStorage.getItem('kw_session');return s?JSON.parse(s):null;}catch{return null;}});
  const[currentUser,setCurrentUser]=useState(null);
  const[users,setUsers]=useState([]);
  const[messages,setMessages]=useState([]);
  const[quotes,setQuotes]=useState([]);
  const[page,setPage]=useState('home');
  const[menuOpen,setMenuOpen]=useState(false);
  function goTo(p){setPage(p);setMenuOpen(false);}
  const[loading,setLoading]=useState(true);
  const[authTab,setAuthTab]=useState('login');
  const[loginForm,setLoginForm]=useState(()=>{try{const s=localStorage.getItem('kw_remember');return s?JSON.parse(s):{email:'',pass:''};}catch{return{email:'',pass:''};}});
  const[rememberMe,setRememberMe]=useState(()=>!!localStorage.getItem('kw_remember'));
  const[regForm,setRegForm]=useState({name:'',email:'',pass:''});
  const[authErr,setAuthErr]=useState('');
  const[authOk,setAuthOk]=useState('');

  useEffect(()=>{
    if(window._fbReady){setReady(true);}
    else{window.addEventListener('fbready',()=>setReady(true));}
  },[]);

  // Seed quotes if empty
  useEffect(()=>{
    if(!ready)return;
    (async()=>{
      const{collection,getDocs,addDoc}=window._fs;
      const snap=await getDocs(collection(window._db,'quotes'));
      if(snap.empty){
        for(const q of INITIAL_QUOTES){
          await addDoc(collection(window._db,'quotes'),q);
        }
      }
    })();
  },[ready]);

  // Real-time listeners
  useEffect(()=>{
    if(!ready)return;
    const{collection,onSnapshot,query,orderBy}=window._fs;
    const unsubUsers=onSnapshot(collection(window._db,'users'),snap=>{
      const list=snap.docs.map(d=>({id:d.id,...d.data()}));
      setUsers(list);
      if(session){
        const me=list.find(u=>u.id===session.id);
        setCurrentUser(me||null);
      }
      setLoading(false);
    });
    const unsubMsgs=onSnapshot(query(collection(window._db,'messages'),orderBy('createdAt','desc')),snap=>{
      setMessages(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    const unsubQuotes=onSnapshot(collection(window._db,'quotes'),snap=>{
      setQuotes(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    return()=>{unsubUsers();unsubMsgs();unsubQuotes();};
  },[ready,session]);

  useEffect(()=>{
    if(!session||users.length===0)return;
    const me=users.find(u=>u.id===session.id);
    setCurrentUser(me||null);
  },[session,users]);

  async function login(){
    const u=users.find(u=>u.email===loginForm.email&&u.pass===loginForm.pass);
    if(!u){setAuthErr('Invalid email or password.');return;}
    if(u.status==='pending'){setAuthErr('Your account is awaiting admin approval.');return;}
    if(u.status==='denied'){setAuthErr('Your account has been denied.');return;}
    const sess={id:u.id};
    setSession(sess);
    localStorage.setItem('kw_session',JSON.stringify(sess));
    if(rememberMe){localStorage.setItem('kw_remember',JSON.stringify({email:loginForm.email,pass:loginForm.pass}));}
    else{localStorage.removeItem('kw_remember');}
    setAuthErr('');setPage('home');
  }

  async function register(){
    if(!regForm.name||!regForm.email||!regForm.pass){setAuthErr('All fields required.');return;}
    if(users.find(u=>u.email===regForm.email)){setAuthErr('Email already registered.');return;}
    const{collection,addDoc}=window._fs;
    const isFirstAdmin=users.length===0;
    const newUser={
      name:regForm.name,email:regForm.email,pass:regForm.pass,
      status:isFirstAdmin?'approved':'pending',
      role:isFirstAdmin?'admin':'user',
      joined:new Date().toISOString().split('T')[0]
    };
    await addDoc(collection(window._db,'users'),newUser);
    setAuthOk('Account created! Please wait for admin approval before logging in.');
    setRegForm({name:'',email:'',pass:''});setAuthTab('login');setAuthErr('');
  }

  function logout(){
    setSession(null);setCurrentUser(null);
    localStorage.removeItem('kw_session');
    setPage('home');
  }

  const isAdmin=currentUser?.role==='admin';
  const pendingCount=users.filter(u=>u.status==='pending').length;

  if(!ready||loading){
    return(
      <><CuteBg/>
      <div className="loading-screen">
        <div style={{fontSize:40}}>🌊</div>
        <h2>Loading KindWave...</h2>
        <div className="spinner"/>
      </div></>
    );
  }

  if(!currentUser){
    return(<><CuteBg/>
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-logo"><h1>🌊 KindWave</h1><p>Spread positivity, one wave at a time</p></div>
          {authErr&&<div className="alert alert-warn">{authErr}</div>}
          {authOk&&<div className="alert alert-success">{authOk}</div>}
          <div className="auth-tabs">
            <div className={`auth-tab ${authTab==='login'?'active':''}`} onClick={()=>{setAuthTab('login');setAuthErr('');setAuthOk('');}}>Sign In</div>
            <div className={`auth-tab ${authTab==='register'?'active':''}`} onClick={()=>{setAuthTab('register');setAuthErr('');setAuthOk('');}}>Create Account</div>
          </div>
          {authTab==='login'?(
            <>
              <div className="form-group"><label>Email</label><input type="email" value={loginForm.email} onChange={e=>setLoginForm(p=>({...p,email:e.target.value}))} placeholder="you@example.com"/></div>
              <div className="form-group"><label>Password</label><input type="password" value={loginForm.pass} onChange={e=>setLoginForm(p=>({...p,pass:e.target.value}))} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&login()}/></div>
              <label className="checkbox-row" style={{textTransform:'none',letterSpacing:0,fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:16}}>
                <input type="checkbox" checked={rememberMe} onChange={e=>setRememberMe(e.target.checked)}/>
                Remember my login
              </label>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={login}>Sign In ✨</button>
            </>
          ):(
            <>
              <div className="form-group"><label>Your Name</label><input value={regForm.name} onChange={e=>setRegForm(p=>({...p,name:e.target.value}))} placeholder="Jane Smith"/></div>
              <div className="form-group"><label>Email</label><input type="email" value={regForm.email} onChange={e=>setRegForm(p=>({...p,email:e.target.value}))} placeholder="you@example.com"/></div>
              <div className="form-group"><label>Password</label><input type="password" value={regForm.pass} onChange={e=>setRegForm(p=>({...p,pass:e.target.value}))} placeholder="Choose a password"/></div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={register}>Request Account 🌊</button>
              <p className="text-muted" style={{textAlign:'center',marginTop:10,fontSize:12}}>An admin will approve your account.</p>
            </>
          )}
        </div>
      </div></>
    );
  }

  return(<><CuteBg/>
    <div className="app">
      <div className={`sidebar${menuOpen?' open':''}`}>
        <div className="sidebar-logo"><h1>🌊 KindWave</h1><p>Positivity platform</p></div>
        <nav className="nav">
          <div className="nav-section">Main</div>
          <div className={`nav-item ${page==='home'?'active':''}`} onClick={()=>goTo('home')}><span className="icon">🏠</span>Home</div>
          <div className={`nav-item ${page==='send'?'active':''}`} onClick={()=>goTo('send')}><span className="icon">💌</span>Send Kindness</div>
          <div className={`nav-item ${page==='inbox'?'active':''}`} onClick={()=>goTo('inbox')}><span className="icon">📬</span>My Inbox</div>
          <div className={`nav-item ${page==='inspiration'?'active':''}`} onClick={()=>goTo('inspiration')}><span className="icon">✨</span>Inspiration</div>
          {isAdmin&&<>
            <div className="nav-section">Admin</div>
            <div className={`nav-item ${page==='admin-users'?'active':''}`} onClick={()=>goTo('admin-users')}><span className="icon">👥</span>Users{pendingCount>0&&<span className="nav-badge">{pendingCount}</span>}</div>
            <div className={`nav-item ${page==='admin-messages'?'active':''}`} onClick={()=>goTo('admin-messages')}><span className="icon">📋</span>All Messages</div>
            <div className={`nav-item ${page==='admin-quotes'?'active':''}`} onClick={()=>goTo('admin-quotes')}><span className="icon">💬</span>Manage Quotes</div>
          </>}
        </nav>
        <div style={{padding:'12px 16px 20px',borderTop:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
            <Avatar name={currentUser.name}/>
            <div><div style={{fontSize:13,fontWeight:700}}>{currentUser.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{isAdmin?'Admin ✨':'Member'}</div></div>
          </div>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={logout}>Sign Out</button>
        </div>
      </div>
      <div className="main">
        <div className={`mobile-overlay${menuOpen?' open':''}`} onClick={()=>setMenuOpen(false)}/>
        <div className="topbar">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button className="hamburger" onClick={()=>setMenuOpen(o=>!o)} aria-label="Menu">
            <span style={{transform:menuOpen?'rotate(45deg) translate(5px,5px)':'none'}}/>
            <span style={{opacity:menuOpen?0:1}}/>
            <span style={{transform:menuOpen?'rotate(-45deg) translate(5px,-5px)':'none'}}/>
          </button>
          <div className="topbar-title">
            {page==='home'&&'Home 🌊'}{page==='send'&&'Send Kindness 💌'}{page==='inbox'&&'My Inbox 📬'}
            {page==='inspiration'&&'Inspiration ✨'}{page==='admin-users'&&'User Management'}
            {page==='admin-messages'&&'All Messages'}{page==='admin-quotes'&&'Manage Quotes'}
          </div>
          <div className="topbar-right">
            {isAdmin&&<span className="badge badge-admin">✨ Admin</span>}
            <Avatar name={currentUser.name}/>
          </div>
        </div>
        <div className="content">
          {page==='home'&&<HomePage currentUser={currentUser} messages={messages} quotes={quotes} setPage={setPage}/>}
          {page==='send'&&<SendPage currentUser={currentUser} users={users} quotes={quotes} setPage={setPage}/>}
          {page==='inbox'&&<InboxPage currentUser={currentUser} messages={messages}/>}
          {page==='inspiration'&&<InspirationPage quotes={quotes.filter(q=>q.active)}/>}
          {page==='admin-users'&&isAdmin&&<AdminUsersPage users={users} currentUser={currentUser}/>}
          {page==='admin-messages'&&isAdmin&&<AdminMessagesPage messages={messages} users={users}/>}
          {page==='admin-quotes'&&isAdmin&&<AdminQuotesPage quotes={quotes}/>}
        </div>
      </div>
    </div></>
  );
}

function SendPage({currentUser,users,quotes,setPage}){
  const[step,setStep]=useState(1);
  const[form,setForm]=useState({toId:'',anonymous:false,type:'message',content:'',author:'',mediaUrl:'',mediaData:null,mediaName:''});
  const[sent,setSent]=useState(false);
  const[selectedQuote,setSelectedQuote]=useState(null);
  const[quoteFilter,setQuoteFilter]=useState('');
  const[dragOver,setDragOver]=useState(false);
  const[sending,setSending]=useState(false);
  const fileRef=useRef();
  const approvedUsers=users.filter(u=>u.status==='approved'&&u.id!==currentUser.id);
  const activeQuotes=quotes.filter(q=>q.active&&q.text.toLowerCase().includes(quoteFilter.toLowerCase()));

  function handleFile(file){
    if(!file)return;
    if(!file.type.startsWith('image/')){alert('Please select an image file.');return;}
    if(file.size>5*1024*1024){alert('Image must be under 5MB.');return;}
    const reader=new FileReader();
    reader.onload=e=>setForm(p=>({...p,mediaData:e.target.result,mediaName:file.name,mediaUrl:''}));
    reader.readAsDataURL(file);
  }

  async function send(){
    if(!form.toId||sending)return;
    setSending(true);
    const toUser=users.find(u=>u.id===form.toId);
    const nm={
      fromId:currentUser.id,toId:form.toId,
      fromName:currentUser.name,toName:toUser?.name||'',
      anonymous:form.anonymous,type:form.type,
      content:form.type==='quote'?(selectedQuote?.text||form.content):form.content,

      mediaUrl:form.type==='media'?form.mediaUrl:'',

      timestamp:new Date().toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),

    await fbAddMessage(nm);
    setSending(false);setSent(true);

    <div style={{maxWidth:580,width:'100%'}}>
      <div className="card">
        <div style={{display:'flex',gap:8,marginBottom:24}}>
          {[1,2,3].map(s=><div key={s} style={{flex:1,height:5,borderRadius:3,background:step>=s?'var(--primary)':'var(--border)',transition:'background .3s'}}/>)}

          <div className="form-group"><label>Recipient</label>

          </div>
          <label className="checkbox-row" style={{marginBottom:20,textTransform:'none',letterSpacing:0,fontSize:13,fontWeight:600,color:'var(--text)'}}>
            <input type="checkbox" checked={form.anonymous} onChange={e=>setForm(p=>({...p,anonymous:e.target.checked}))}/>
            Send anonymously <span style={{color:'var(--text-muted)',fontWeight:400}}>(they won't know it's you)</span>
          </label>
          <button className="btn btn-primary" disabled={!form.toId} onClick={()=>setStep(2)}>Next →</button>
        </>)}

          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:24}}>

              <div key={t.type} onClick={()=>setForm(p=>({...p,type:t.type}))} style={{border:`2px solid ${form.type===t.type?'var(--primary)':'var(--border)'}`,borderRadius:14,padding:14,cursor:'pointer',textAlign:'center',background:form.type===t.type?'var(--primary-light)':'rgba(255,255,255,0.6)',transition:'all .15s'}}>
                <div style={{fontSize:24,marginBottom:6}}>{t.icon}</div>

          {form.type==='message'&&<div className="form-group"><label>Your message</label><textarea value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="Share something positive..." style={{minHeight:120}}/></div>}

              <td><div className="gap-2">
                <button className="btn btn-ghost btn-sm" onClick={()=>setEditing({...q})}>Edit</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>toggleActive(q.id,q.active)}>{q.active?'Hide':'Show'}</button>
                <button className="btn btn-danger btn-sm" onClick={()=>deleteQuote(q.id)}>Delete</button>
              </div></td>
            </tr>
          ))}
        </tbody>
      </table></div></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
