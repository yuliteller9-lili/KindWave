<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KindWave</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF8FA;--surface:#FFFBFD;--card:#FFFFFF;
  --primary:#CC88BB;--primary-light:#FAF0F7;--primary-dark:#A06090;
  --accent:#B090D0;--accent-light:#F3EFFC;
  --pink:#E0A8C8;--pink-light:#FEF4F9;
  --green:#6DB87A;--green-light:#EBF7EF;
  --text:#3A2040;--text-muted:#907898;--text-light:#C8B0C8;
  --border:#F2DDEF;--border-strong:#DEB8DC;
  --danger:#C87888;--danger-light:#FEF2F4;
  --warn:#C8985A;--warn-light:#FDF4E5;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;overflow-x:hidden}

/* ── Cute background canvas ── */
.bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:60% 40% 55% 45% / 50% 60% 40% 55%;filter:blur(45px);opacity:1}
.blob1{width:420px;height:340px;background:rgba(238,170,195,0.72);top:-60px;left:-80px}
.blob2{width:380px;height:300px;background:rgba(242,178,200,0.68);bottom:-50px;right:-60px}
.blob3{width:220px;height:180px;background:rgba(228,165,195,0.55);bottom:100px;right:10px}
.blob4{position:absolute;border-radius:45% 55% 40% 60% / 55% 45% 60% 40%;filter:blur(50px);opacity:1;width:300px;height:240px;background:rgba(210,175,225,0.55);top:40%;left:50%;transform:translateX(-50%)}
.deco-heart{position:absolute;pointer-events:none}
.deco-heart svg{opacity:0.75}
.deco-star{position:absolute;pointer-events:none;opacity:0.7}
.deco-bow{position:absolute;pointer-events:none;opacity:0.65}
.deco-butterfly{position:absolute;pointer-events:none;opacity:0.7}
.deco-dotline{position:absolute;pointer-events:none;opacity:0.35}

h1,h2,h3{font-family:'Playfair Display',serif}
.app{display:flex;height:100vh;overflow:hidden;position:relative;z-index:2}
.sidebar{width:230px;background:linear-gradient(180deg,rgba(255,248,253,0.88) 0%,rgba(252,240,255,0.88) 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;backdrop-filter:blur(12px)}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:22px;color:var(--primary);letter-spacing:-0.5px}
.sidebar-logo p{font-size:11px;color:var(--text-muted);margin-top:2px}
.nav{padding:14px 0;flex:1;overflow-y:auto}
.nav-section{padding:8px 18px 4px;font-size:10px;font-weight:700;color:var(--text-light);letter-spacing:1.2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);border-left:3px solid transparent;border-radius:0 10px 10px 0;margin:1px 8px 1px 0;transition:all .15s}
.nav-item:hover{color:var(--primary);background:var(--primary-light)}
.nav-item.active{color:var(--primary-dark);background:var(--primary-light);border-left-color:var(--primary)}
.nav-item .icon{width:18px;text-align:center;font-size:15px}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:transparent}
.topbar{background:rgba(255,251,253,0.88);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;backdrop-filter:blur(12px)}
.topbar-title{font-size:18px;font-weight:700;color:var(--text);font-family:'Playfair Display',serif}
.topbar-right{display:flex;align-items:center;gap:12px}
.content{flex:1;overflow-y:auto;padding:28px;background:transparent}
.card{background:rgba(255,255,255,0.88);border:1px solid var(--border);border-radius:18px;padding:20px;backdrop-filter:blur(4px)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-size:15px;font-weight:700;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:50px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:'Nunito',sans-serif}
.btn-primary{background:linear-gradient(135deg,#CC88BB,#E0A8C8);color:#fff;box-shadow:0 2px 10px rgba(200,136,187,0.28)}.btn-primary:hover{box-shadow:0 4px 16px rgba(200,136,187,0.38);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;transform:none;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--primary-light);border-color:var(--border-strong)}
.btn-success{background:linear-gradient(135deg,var(--green),#4aa860);color:#fff}.btn-success:hover{opacity:.9}
.btn-danger{background:linear-gradient(135deg,var(--danger),#b05068);color:#fff}.btn-danger:hover{opacity:.9}
.btn-accent{background:linear-gradient(135deg,var(--accent),#8870b8);color:#fff}.btn-accent:hover{opacity:.9}
.btn-sm{padding:5px 14px;font-size:12px}
input,textarea,select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:13px;font-family:'Nunito',sans-serif;background:rgba(255,255,255,0.85);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(204,136,187,0.12)}
textarea{resize:vertical;min-height:80px}
label{font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.6px}
.form-group{margin-bottom:14px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:2}
.auth-card{background:rgba(255,255,255,0.90);border:1px solid var(--border);border-radius:24px;padding:38px 34px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(200,136,187,0.13);backdrop-filter:blur(12px)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo h1{font-size:34px;color:var(--primary)}
.auth-logo p{color:var(--text-muted);font-size:14px;margin-top:4px}
.auth-tabs{display:flex;margin-bottom:24px;background:var(--bg);border-radius:50px;padding:3px}
.auth-tab{flex:1;padding:9px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--text-muted);border-radius:50px;transition:all .2s}
.auth-tab.active{background:linear-gradient(135deg,#CC88BB,#E0A8C8);color:#fff;box-shadow:0 2px 8px rgba(200,136,187,0.28)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--primary-light)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-pending{background:var(--warn-light);color:#8a6010}
.badge-approved{background:var(--green-light);color:#2a7045}
.badge-admin{background:var(--accent-light);color:#5a3090}
.badge-denied{background:var(--danger-light);color:#8a2040}
.badge-anon{background:var(--primary-light);color:var(--primary-dark)}
.msg-card{background:rgba(255,255,255,0.88);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.msg-from{font-size:12px;font-weight:700;color:var(--text-muted)}
.msg-body{font-size:14px;line-height:1.65;color:var(--text)}
.msg-type-badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700}
.msg-type-quote{background:var(--accent-light);color:#5a3090}
.msg-type-message{background:var(--green-light);color:#2a7045}
.msg-type-media{background:var(--pink-light);color:#8a3060}
.msg-time{font-size:11px;color:var(--text-light);margin-left:auto}
.quote-card{background:rgba(255,255,255,0.88);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:12px}
.quote-text{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;color:var(--text);margin-bottom:8px;font-style:italic}
.quote-author{font-size:12px;color:var(--text-muted);font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:linear-gradient(135deg,rgba(255,255,255,0.92),rgba(255,244,251,0.92));border:1px solid var(--border);border-radius:16px;padding:18px}
.stat-value{font-size:30px;font-weight:700;font-family:'Playfair Display',serif;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:600}
.alert{padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;font-weight:600}
.alert-warn{background:var(--warn-light);color:#7a5010;border:1px solid #f0d090}
.alert-success{background:var(--green-light);color:#2a6040;border:1px solid #90d0a0}
.alert-info{background:var(--accent-light);color:#4a2080;border:1px solid #c0a0f0}
.empty{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px;font-weight:600}
.tabs{display:flex;border-bottom:1.5px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s;border-radius:8px 8px 0 0}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
.tab:hover{color:var(--primary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gap-2{display:flex;gap:8px;flex-wrap:wrap}
.text-muted{color:var(--text-muted);font-size:13px}
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.checkbox-row input[type=checkbox]{width:auto}
.upload-area{border:2px dashed var(--border-strong);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--primary-light)}
.upload-area:hover{border-color:var(--primary);background:rgba(204,136,187,0.08)}
.upload-area.dragover{border-color:var(--primary);background:rgba(204,136,187,0.12)}
.upload-area.has-file{border-style:solid;border-color:var(--primary);background:rgba(204,136,187,0.06)}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted)}
.remember-row input{width:auto}
</style>
</head>
<body>

function useStorage(key,initial){
  const[val,setVal]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):initial;}catch{return initial;}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(val));}catch{}},[key,val]);
  return[val,setVal];
}
function Avatar({name,size=28}){
  const initials=(name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const colors=['#C96BB5','#9B6DD4','#E87BB5','#6DB87A','#D4875A','#5A9BD4'];
  const color=colors[(name||'').charCodeAt(0)%colors.length];
  return <div style={{width:size,height:size,borderRadius:'50%',background:color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.38,fontWeight:700,flexShrink:0,border:'2px solid rgba(255,255,255,0.7)'}}>{initials}</div>;
}

function App(){
  const[users,setUsers]=useStorage('kw_users',[{id:1,name:"Admin",email:ADMIN_EMAIL,pass:ADMIN_PASS,status:"approved",role:"admin",joined:"2024-01-01"},...SAMPLE_USERS]);
  const[messages,setMessages]=useStorage('kw_messages',SAMPLE_MESSAGES);
  const[quotes,setQuotes]=useStorage('kw_quotes',INITIAL_QUOTES);
  const[session,setSession]=useStorage('kw_session',null);
  const[page,setPage]=useState('home');
  const[authTab,setAuthTab]=useState('login');
  const[loginForm,setLoginForm]=useState(()=>{
    try{const s=localStorage.getItem('kw_remember');return s?JSON.parse(s):{email:'',pass:''};}
    catch{return{email:'',pass:''};}
  });
  const[rememberMe,setRememberMe]=useState(()=>!!localStorage.getItem('kw_remember'));
  const[regForm,setRegForm]=useState({name:'',email:'',pass:''});
  const[authErr,setAuthErr]=useState('');
  const[authOk,setAuthOk]=useState('');
  const currentUser=session?users.find(u=>u.id===session.id):null;
  const isAdmin=currentUser?.role==='admin';
  const pendingCount=users.filter(u=>u.status==='pending').length;
  function login(){
    const u=users.find(u=>u.email===loginForm.email&&u.pass===loginForm.pass);
    if(!u){setAuthErr('Invalid email or password.');return;}
    if(u.status==='pending'){setAuthErr('Your account is awaiting admin approval.');return;}
    if(u.status==='denied'){setAuthErr('Your account has been denied.');return;}
    if(rememberMe){localStorage.setItem('kw_remember',JSON.stringify({email:loginForm.email,pass:loginForm.pass}));}
    else{localStorage.removeItem('kw_remember');}
    setSession({id:u.id});setAuthErr('');setPage('home');
  }
  function register(){
    if(!regForm.name||!regForm.email||!regForm.pass){setAuthErr('All fields required.');return;}
    if(users.find(u=>u.email===regForm.email)){setAuthErr('Email already registered.');return;}
    const nu={id:Date.now(),name:regForm.name,email:regForm.email,pass:regForm.pass,status:'pending',role:'user',joined:new Date().toISOString().split('T')[0]};
    setUsers(prev=>[...prev,nu]);
    setAuthOk('Account created! Please wait for admin approval before logging in.');
    setRegForm({name:'',email:'',pass:''});setAuthTab('login');setAuthErr('');
  }
  function logout(){setSession(null);setPage('home');}

  if(!currentUser){
    return(
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-logo"><h1>🌊 KindWave</h1><p>Spread positivity, one wave at a time</p></div>
          {authErr&&<div className="alert alert-warn">{authErr}</div>}
          {authOk&&<div className="alert alert-success">{authOk}</div>}
          <div className="auth-tabs">
            <div className={`auth-tab ${authTab==='login'?'active':''}`} onClick={()=>{setAuthTab('login');setAuthErr('');setAuthOk('');}}>Sign In</div>
            <div className={`auth-tab ${authTab==='register'?'active':''}`} onClick={()=>{setAuthTab('register');setAuthErr('');setAuthOk('');}}>Create Account</div>
          </div>
          {authTab==='login'?(
            <>
              <div className="form-group"><label>Email</label><input type="email" value={loginForm.email} onChange={e=>setLoginForm(p=>({...p,email:e.target.value}))} placeholder="you@example.com"/></div>
              <div className="form-group"><label>Password</label><input type="password" value={loginForm.pass} onChange={e=>setLoginForm(p=>({...p,pass:e.target.value}))} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&login()}/></div>
              <label className="remember-row" style={{textTransform:'none',letterSpacing:0}}>
                <input type="checkbox" checked={rememberMe} onChange={e=>setRememberMe(e.target.checked)}/>
                Remember my login
              </label>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={login}>Sign In ✨</button>
              <p className="text-muted" style={{textAlign:'center',marginTop:12,fontSize:11}}>Admin: admin@kindwave.com / admin123</p>
            </>
          ):(
            <>
              <div className="form-group"><label>Your Name</label><input value={regForm.name} onChange={e=>setRegForm(p=>({...p,name:e.target.value}))} placeholder="Jane Smith"/></div>
              <div className="form-group"><label>Email</label><input type="email" value={regForm.email} onChange={e=>setRegForm(p=>({...p,email:e.target.value}))} placeholder="you@example.com"/></div>
              <div className="form-group"><label>Password</label><input type="password" value={regForm.pass} onChange={e=>setRegForm(p=>({...p,pass:e.target.value}))} placeholder="Choose a password"/></div>
              <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={register}>Request Account 🌊</button>
              <p className="text-muted" style={{textAlign:'center',marginTop:10,fontSize:12}}>An admin will approve your account.</p>
            </>
          )}
        </div>
      </div>
    );
  }

  return(
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo"><h1>🌊 KindWave</h1><p>Positivity platform</p></div>
        <nav className="nav">
          <div className="nav-section">Main</div>
          <div className={`nav-item ${page==='home'?'active':''}`} onClick={()=>setPage('home')}><span className="icon">🏠</span>Home</div>
          <div className={`nav-item ${page==='send'?'active':''}`} onClick={()=>setPage('send')}><span className="icon">💌</span>Send Kindness</div>
          <div className={`nav-item ${page==='inbox'?'active':''}`} onClick={()=>setPage('inbox')}><span className="icon">📬</span>My Inbox</div>
          <div className={`nav-item ${page==='inspiration'?'active':''}`} onClick={()=>setPage('inspiration')}><span className="icon">✨</span>Inspiration</div>
          {isAdmin&&<>
            <div className="nav-section">Admin</div>
            <div className={`nav-item ${page==='admin-users'?'active':''}`} onClick={()=>setPage('admin-users')}><span className="icon">👥</span>Users{pendingCount>0&&<span className="nav-badge">{pendingCount}</span>}</div>
            <div className={`nav-item ${page==='admin-messages'?'active':''}`} onClick={()=>setPage('admin-messages')}><span className="icon">📋</span>All Messages</div>
            <div className={`nav-item ${page==='admin-quotes'?'active':''}`} onClick={()=>setPage('admin-quotes')}><span className="icon">💬</span>Manage Quotes</div>
          </>}
        </nav>
        <div style={{padding:'12px 16px 20px',borderTop:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
            <Avatar name={currentUser.name}/>
            <div><div style={{fontSize:13,fontWeight:700}}>{currentUser.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{currentUser.role==='admin'?'Admin ✨':'Member'}</div></div>
          </div>
          <button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={logout}>Sign Out</button>
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <div className="topbar-title">
            {page==='home'&&'Home 🌊'}{page==='send'&&'Send Kindness 💌'}{page==='inbox'&&'My Inbox 📬'}
            {page==='inspiration'&&'Inspiration ✨'}{page==='admin-users'&&'User Management'}
            {page==='admin-messages'&&'All Messages'}{page==='admin-quotes'&&'Manage Quotes'}
          </div>
          <div className="topbar-right">
            {isAdmin&&<span className="badge badge-admin">✨ Admin</span>}
            <Avatar name={currentUser.name}/>
          </div>
        </div>
        <div className="content">
          {page==='home'&&<HomePage currentUser={currentUser} messages={messages} quotes={quotes} setPage={setPage}/>}
          {page==='send'&&<SendPage currentUser={currentUser} users={users} quotes={quotes} setMessages={setMessages} setPage={setPage}/>}
          {page==='inbox'&&<InboxPage currentUser={currentUser} messages={messages}/>}
          {page==='inspiration'&&<InspirationPage quotes={quotes.filter(q=>q.active)}/>}
          {page==='admin-users'&&isAdmin&&<AdminUsersPage users={users} setUsers={setUsers} currentUser={currentUser} messages={messages} setMessages={setMessages}/>}
          {page==='admin-messages'&&isAdmin&&<AdminMessagesPage messages={messages} setMessages={setMessages}/>}
          {page==='admin-quotes'&&isAdmin&&<AdminQuotesPage quotes={quotes} setQuotes={setQuotes}/>}
        </div>
      </div>
    </div>
  );
}

          <div style={{fontFamily:'Playfair Display,serif',fontSize:17,lineHeight:1.65,color:'var(--text)',marginBottom:8,fontStyle:'italic'}}>"{randomQ.text}"</div>
          <div style={{fontSize:12,color:'var(--text-muted)',fontWeight:600}}>— {randomQ.author}</div>

function SendPage({currentUser,users,quotes,setMessages,setPage}){
  const[step,setStep]=useState(1);
  const[form,setForm]=useState({toId:'',anonymous:false,type:'message',content:'',author:'',mediaUrl:'',mediaData:null,mediaName:''});
  const[sent,setSent]=useState(false);
  const[selectedQuote,setSelectedQuote]=useState(null);
  const[quoteFilter,setQuoteFilter]=useState('');
  const[dragOver,setDragOver]=useState(false);
  const fileRef=useRef();

  const approvedUsers=users.filter(u=>u.status==='approved'&&u.id!==currentUser.id);
  const activeQuotes=quotes.filter(q=>q.active&&q.text.toLowerCase().includes(quoteFilter.toLowerCase()));

  function handleFile(file){
    if(!file)return;
    if(!file.type.startsWith('image/')){alert('Please select an image file.');return;}
    if(file.size>5*1024*1024){alert('Image must be under 5MB.');return;}
    const reader=new FileReader();
    reader.onload=e=>setForm(p=>({...p,mediaData:e.target.result,mediaName:file.name,mediaUrl:''}));
    reader.readAsDataURL(file);
  }

  function send(){
    if(!form.toId)return;
    const toUser=users.find(u=>u.id===parseInt(form.toId));
    const nm={
      id:Date.now(),fromId:currentUser.id,toId:parseInt(form.toId),
      fromName:currentUser.name,toName:toUser?.name||'',
      anonymous:form.anonymous,type:form.type,
      content:form.type==='quote'?(selectedQuote?.text||form.content):form.content,
      author:form.type==='quote'?(selectedQuote?.author||form.author):'',
      mediaUrl:form.type==='media'?form.mediaUrl:'',
      mediaData:form.type==='media'?form.mediaData:null,
      mediaName:form.type==='media'?form.mediaName:'',
      timestamp:new Date().toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
      flagged:false
    };
    setMessages(prev=>[...prev,nm]);setSent(true);
  }

  function resetSend(){setSent(false);setForm({toId:'',anonymous:false,type:'message',content:'',author:'',mediaUrl:'',mediaData:null,mediaName:''});setSelectedQuote(null);setStep(1);}

  const canSend=form.type==='media'?(form.mediaData||form.mediaUrl):(form.content);

  if(sent){
    return(
      <div style={{textAlign:'center',padding:'60px 20px'}}>
        <div style={{fontSize:56,marginBottom:16}}>🌊</div>
        <h2 style={{fontSize:26,fontWeight:400,marginBottom:8}}>Your wave of kindness was sent!</h2>
        <p className="text-muted" style={{marginBottom:24}}>You made someone's day a little brighter.</p>
        <div className="gap-2" style={{justifyContent:'center'}}>
          <button className="btn btn-primary" onClick={resetSend}>Send Another 💌</button>
          <button className="btn btn-ghost" onClick={()=>setPage('home')}>Go Home</button>
        </div>
      </div>
    );
  }

  return(
    <div style={{maxWidth:580}}>
      <div className="card">
        <div style={{display:'flex',gap:8,marginBottom:24}}>
          {[1,2,3].map(s=>(
            <div key={s} style={{flex:1,height:5,borderRadius:3,background:step>=s?'var(--primary)':'var(--border)',transition:'background .3s'}}/>
          ))}
        </div>
        {step===1&&(
          <>
            <h3 style={{marginBottom:4,fontWeight:400}}>Who are you sending to?</h3>
            <p className="text-muted" style={{marginBottom:20,fontSize:13}}>Choose a recipient and whether to stay anonymous.</p>
            <div className="form-group">
              <label>Recipient</label>
              <select value={form.toId} onChange={e=>setForm(p=>({...p,toId:e.target.value}))}>
                <option value="">Select someone...</option>
                {approvedUsers.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
            </div>
            <label className="checkbox-row" style={{marginBottom:20,textTransform:'none',letterSpacing:0,fontSize:13,fontWeight:600,color:'var(--text)'}}>
              <input type="checkbox" checked={form.anonymous} onChange={e=>setForm(p=>({...p,anonymous:e.target.checked}))}/> 
              Send anonymously <span style={{color:'var(--text-muted)',fontWeight:400}}>(they won't know it's you)</span>
            </label>
            <button className="btn btn-primary" disabled={!form.toId} onClick={()=>setStep(2)}>Next →</button>
          </>
        )}
        {step===2&&(
          <>
            <h3 style={{marginBottom:4,fontWeight:400}}>What are you sending?</h3>
            <p className="text-muted" style={{marginBottom:20,fontSize:13}}>Choose the type of kindness to share.</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:24}}>
              {[
                {type:'message',icon:'💬',label:'Message',desc:'A personal note'},
                {type:'quote',icon:'✨',label:'Quote',desc:'An inspiring quote'},
                {type:'media',icon:'🖼️',label:'Photo / GIF',desc:'Upload or link'},
              ].map(t=>(
                <div key={t.type} onClick={()=>setForm(p=>({...p,type:t.type}))} style={{border:`2px solid ${form.type===t.type?'var(--primary)':'var(--border)'}`,borderRadius:14,padding:14,cursor:'pointer',textAlign:'center',background:form.type===t.type?'var(--primary-light)':'rgba(255,255,255,0.6)',transition:'all .15s'}}>
                  <div style={{fontSize:24,marginBottom:6}}>{t.icon}</div>
                  <div style={{fontSize:13,fontWeight:700,marginBottom:3}}>{t.label}</div>
                  <div style={{fontSize:11,color:'var(--text-muted)'}}>{t.desc}</div>
                </div>
              ))}
            </div>
            <div className="gap-2">
              <button className="btn btn-ghost" onClick={()=>setStep(1)}>← Back</button>
              <button className="btn btn-primary" onClick={()=>setStep(3)}>Next →</button>
            </div>
          </>
        )}
        {step===3&&(
          <>
            <h3 style={{marginBottom:4,fontWeight:400}}>Write your message</h3>
            <p className="text-muted" style={{marginBottom:20,fontSize:13}}>
              Sending to <strong>{users.find(u=>u.id===parseInt(form.toId))?.name}</strong>{form.anonymous?' anonymously':''}
            </p>
            {form.type==='message'&&(
              <div className="form-group">
                <label>Your message</label>
                <textarea value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="Share something positive, an appreciation, or an uplifting thought..." style={{minHeight:120}}/>
              </div>
            )}
            {form.type==='quote'&&(
              <>
                <div className="form-group"><label>Search quotes</label><input value={quoteFilter} onChange={e=>setQuoteFilter(e.target.value)} placeholder="Filter quotes..."/></div>
                <div style={{maxHeight:200,overflowY:'auto',marginBottom:12,border:'1px solid var(--border)',borderRadius:12}}>
                  {activeQuotes.length===0?<div style={{padding:16,textAlign:'center',color:'var(--text-muted)',fontSize:13}}>No quotes found</div>:
                    activeQuotes.map(q=>(
                      <div key={q.id} onClick={()=>{setSelectedQuote(q);setForm(p=>({...p,content:q.text,author:q.author}));}} style={{padding:'10px 14px',cursor:'pointer',borderBottom:'1px solid var(--border)',background:selectedQuote?.id===q.id?'var(--primary-light)':'',transition:'background .1s'}}>
                        <div style={{fontSize:13,fontStyle:'italic',marginBottom:2}}>"{q.text}"</div>
                        <div style={{fontSize:11,color:'var(--text-muted)'}}>— {q.author}</div>
                      </div>
                    ))
                  }
                </div>
                <p className="text-muted" style={{fontSize:12,marginBottom:12}}>Or write your own:</p>
                <div className="form-group"><label>Quote text</label><textarea value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="Type a quote..."/></div>
                <div className="form-group"><label>Author</label><input value={form.author} onChange={e=>setForm(p=>({...p,author:e.target.value}))} placeholder="Author name"/></div>
              </>
            )}
            {form.type==='media'&&(
              <>
                <div className="form-group">
                  <label>Upload a photo, GIF or meme</label>
                  <div
                    className={`upload-area${form.mediaData?' has-file':''}${dragOver?' dragover':''}`}
                    onClick={()=>fileRef.current.click()}
                    onDragOver={e=>{e.preventDefault();setDragOver(true);}}
                    onDragLeave={()=>setDragOver(false)}
                    onDrop={e=>{e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0]);}}
                  >
                    {form.mediaData?(
                      <>
                        <img src={form.mediaData} alt="preview" style={{maxWidth:'100%',maxHeight:200,borderRadius:10,objectFit:'contain'}}/>
                        <div style={{marginTop:8,fontSize:12,color:'var(--primary)',fontWeight:600}}>{form.mediaName}</div>
                        <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Click to change image</div>
                      </>
                    ):(
                      <>
                        <div style={{fontSize:36,marginBottom:8}}>🖼️</div>
                        <div style={{fontSize:13,fontWeight:700,color:'var(--primary)',marginBottom:4}}>Click to upload or drag & drop</div>
                        <div style={{fontSize:12,color:'var(--text-muted)'}}>JPG, PNG, GIF, WebP — max 5MB</div>
                      </>
                    )}
                    <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
                  </div>
                </div>
                <div style={{textAlign:'center',margin:'6px 0 10px',fontSize:12,color:'var(--text-muted)',fontWeight:600}}>— or paste a link instead —</div>
                <div className="form-group">
                  <label>Image / GIF URL (optional)</label>
                  <input value={form.mediaUrl} onChange={e=>setForm(p=>({...p,mediaUrl:e.target.value,mediaData:null,mediaName:''}))} placeholder="https://media.giphy.com/..."/>
                  {form.mediaUrl&&!form.mediaData&&<img src={form.mediaUrl} alt="preview" style={{maxWidth:'100%',maxHeight:160,borderRadius:10,objectFit:'contain',marginTop:8}} onError={e=>e.target.style.display='none'}/>}
                </div>
                <div className="form-group"><label>Add a note (optional)</label><textarea value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="Add a message to go with it..." style={{minHeight:70}}/></div>
              </>
            )}
            <div className="gap-2">
              <button className="btn btn-ghost" onClick={()=>setStep(2)}>← Back</button>
              <button className="btn btn-primary" disabled={!canSend} onClick={send}>🌊 Send Wave</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function InboxPage({currentUser,messages}){
  const[tab,setTab]=useState('received');
  const received=messages.filter(m=>m.toId===currentUser.id).reverse();
  const sent=messages.filter(m=>m.fromId===currentUser.id).reverse();
  const list=tab==='received'?received:sent;
  return(
    <div>
      <div className="tabs">
        <div className={`tab ${tab==='received'?'active':''}`} onClick={()=>setTab('received')}>Received ({received.length})</div>
        <div className={`tab ${tab==='sent'?'active':''}`} onClick={()=>setTab('sent')}>Sent ({sent.length})</div>
      </div>
      {list.length===0?<div className="empty"><div className="empty-icon">{tab==='received'?'💌':'🌊'}</div><p>{tab==='received'?'No messages received yet':'You haven\'t sent any messages yet'}</p></div>:
        list.map(m=>(
          <div key={m.id} className="msg-card">
            <div className="msg-meta">
              {tab==='received'?<span className="msg-from">From: {m.anonymous?<span>Someone special 🎭</span>:m.fromName}</span>:<span className="msg-from">To: {m.toName}</span>}
              <span className={`msg-type-badge msg-type-${m.type}`}>{m.type}</span>
              <span className="msg-time">{m.timestamp}</span>
              {tab==='sent'&&m.anonymous&&<span className="badge badge-anon">anonymous</span>}
            </div>
            <div className="msg-body">
              {m.type==='quote'?<em>"{m.content}" {m.author&&`— ${m.author}`}</em>:m.content}
              {m.mediaData&&<div style={{marginTop:8}}><img src={m.mediaData} alt="shared" style={{maxWidth:'100%',maxHeight:220,borderRadius:10,objectFit:'contain'}}/></div>}
              {m.mediaUrl&&!m.mediaData&&<div style={{marginTop:8}}><img src={m.mediaUrl} alt="shared" style={{maxWidth:'100%',maxHeight:220,borderRadius:10,objectFit:'contain'}} onError={e=>e.target.style.display='none'}/></div>}
            </div>
          </div>
        ))
      }
    </div>
  );
}

function InspirationPage({quotes}){
  const[idx,setIdx]=useState(()=>Math.floor(Math.random()*Math.max(quotes.length,1)));
  if(!quotes.length)return <div className="empty"><div className="empty-icon">✨</div><p>No quotes yet</p></div>;
  const featured=quotes[idx%quotes.length];
  return(
    <div>
      <div style={{background:'linear-gradient(135deg,rgba(201,107,181,0.18),rgba(155,109,212,0.18))',border:'1px solid var(--border)',borderRadius:20,padding:32,marginBottom:28,textAlign:'center'}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--primary)',letterSpacing:1.2,textTransform:'uppercase',marginBottom:14}}>✨ Featured Quote</div>
        <div style={{fontFamily:'Playfair Display,serif',fontSize:22,lineHeight:1.65,color:'var(--text)',marginBottom:12,fontStyle:'italic'}}>"{featured.text}"</div>
        <div style={{fontSize:13,color:'var(--text-muted)',fontWeight:600}}>— {featured.author}</div>
        <button className="btn btn-ghost btn-sm" style={{marginTop:18}} onClick={()=>setIdx(i=>(i+1)%quotes.length)}>Shuffle ↻</button>
      </div>
      <h3 style={{marginBottom:16,fontSize:16,fontWeight:700}}>All Quotes ({quotes.length})</h3>
      <div style={{columns:2,columnGap:16}}>
        {quotes.map(q=>(
          <div key={q.id} className="quote-card" style={{breakInside:'avoid',marginBottom:12}}>
            <div className="quote-text">"{q.text}"</div>
            <div className="quote-author">— {q.author}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AdminUsersPage({users,setUsers,currentUser,messages,setMessages}){
  const[tab,setTab]=useState('pending');
  const[confirmDelete,setConfirmDelete]=useState(null);
  const filtered=users.filter(u=>u.id!==1&&(tab==='all'||u.status===tab));
  function approve(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,status:'approved'}:u));}
  function deny(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,status:'denied'}:u));}
  function makeAdmin(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,role:'admin'}:u));}
  function removeAdmin(id){setUsers(prev=>prev.map(u=>u.id===id?{...u,role:'user'}:u));}
  function deleteUser(id){setUsers(prev=>prev.filter(u=>u.id!==id));setMessages(prev=>prev.filter(m=>m.fromId!==id&&m.toId!==id));setConfirmDelete(null);}
  const userToDelete=confirmDelete?users.find(u=>u.id===confirmDelete):null;
  return(
    <div>
      {confirmDelete&&userToDelete&&(
        <div style={{position:'fixed',inset:0,background:'rgba(58,31,58,0.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
          <div style={{background:'var(--card)',borderRadius:20,padding:32,maxWidth:380,width:'90%',border:'1px solid var(--border)',textAlign:'center'}}>
            <div style={{fontSize:36,marginBottom:12}}>⚠️</div>
            <h3 style={{marginBottom:8,fontSize:18,fontWeight:400}}>Delete user?</h3>
            <p style={{color:'var(--text-muted)',fontSize:13,marginBottom:6}}>Permanently delete <strong>{userToDelete.name}</strong>.</p>
            <p style={{color:'var(--danger)',fontSize:12,marginBottom:24}}>This will also delete all their messages. Cannot be undone.</p>
            <div className="gap-2" style={{justifyContent:'center'}}>
              <button className="btn btn-danger" onClick={()=>deleteUser(confirmDelete)}>Yes, delete</button>
              <button className="btn btn-ghost" onClick={()=>setConfirmDelete(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
      <div className="tabs">
        <div className={`tab ${tab==='pending'?'active':''}`} onClick={()=>setTab('pending')}>Pending ({users.filter(u=>u.status==='pending').length})</div>
        <div className={`tab ${tab==='approved'?'active':''}`} onClick={()=>setTab('approved')}>Approved</div>
        <div className={`tab ${tab==='denied'?'active':''}`} onClick={()=>setTab('denied')}>Denied</div>
        <div className={`tab ${tab==='all'?'active':''}`} onClick={()=>setTab('all')}>All</div>
      </div>
      {filtered.length===0?<div className="empty"><div className="empty-icon">👥</div><p>No users in this category</p></div>:(
        <div className="card">
          <div className="table-wrap">
            <table>
              <thead><tr><th>User</th><th>Email</th><th>Joined</th><th>Status</th><th>Role</th><th>Actions</th></tr></thead>
              <tbody>
                {filtered.map(u=>(
                  <tr key={u.id}>
                    <td><div style={{display:'flex',alignItems:'center',gap:10}}><Avatar name={u.name} size={32}/><span style={{fontWeight:700}}>{u.name}</span></div></td>
                    <td style={{color:'var(--text-muted)'}}>{u.email}</td>
                    <td style={{color:'var(--text-muted)',fontSize:12}}>{u.joined}</td>
                    <td><span className={`badge badge-${u.status}`}>{u.status}</span></td>
                    <td><span className={`badge ${u.role==='admin'?'badge-admin':'badge-anon'}`}>{u.role}</span></td>
                    <td>
                      <div className="gap-2">
                        {u.status==='pending'&&<><button className="btn btn-success btn-sm" onClick={()=>approve(u.id)}>✓ Approve</button><button className="btn btn-danger btn-sm" onClick={()=>deny(u.id)}>✗ Deny</button></>}
                        {u.status==='denied'&&<button className="btn btn-ghost btn-sm" onClick={()=>approve(u.id)}>Approve</button>}
                        {u.status==='approved'&&u.role!=='admin'&&u.id!==currentUser.id&&<button className="btn btn-accent btn-sm" onClick={()=>makeAdmin(u.id)}>Make Admin</button>}
                        {u.role==='admin'&&u.id!==currentUser.id&&<button className="btn btn-ghost btn-sm" onClick={()=>removeAdmin(u.id)}>Remove Admin</button>}
                        {u.id!==currentUser.id&&<button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(u.id)}>🗑 Delete</button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminMessagesPage({messages,setMessages}){
  const[filter,setFilter]=useState('');
  const filtered=messages.filter(m=>{
    const s=filter.toLowerCase();
    return !s||m.fromName.toLowerCase().includes(s)||m.toName.toLowerCase().includes(s)||(m.content||'').toLowerCase().includes(s);
  }).slice().reverse();
  return(
    <div>
      <div className="alert alert-info">👁️ As admin, you can see all messages including anonymous senders.</div>
      <div style={{marginBottom:16}}><input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Search by name or content..."/></div>
      {filtered.length===0?<div className="empty"><div className="empty-icon">📋</div><p>No messages found</p></div>:
        filtered.map(m=>(
          <div key={m.id} className="msg-card" style={{borderLeft:`3px solid ${m.anonymous?'var(--accent)':'var(--green)'}`}}>
            <div className="msg-meta">
              <Avatar name={m.fromName} size={22}/>
              <span className="msg-from" style={{fontWeight:700}}>{m.fromName}</span>
              {m.anonymous&&<span className="badge badge-anon" style={{fontSize:10}}>sent anonymously</span>}
              <span style={{fontSize:12,color:'var(--text-muted)'}}>→</span>
              <Avatar name={m.toName} size={22}/>
              <span style={{fontSize:12,fontWeight:700}}>{m.toName}</span>
              <span className={`msg-type-badge msg-type-${m.type}`}>{m.type}</span>
              <span className="msg-time">{m.timestamp}</span>
            </div>
            <div className="msg-body">
              {m.type==='quote'?<em>"{m.content}" {m.author&&`— ${m.author}`}</em>:m.content}
              {m.mediaData&&<div style={{marginTop:8}}><img src={m.mediaData} alt="media" style={{maxWidth:'100%',maxHeight:160,borderRadius:10,objectFit:'contain'}}/></div>}
              {m.mediaUrl&&!m.mediaData&&<div style={{marginTop:6}}><a href={m.mediaUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--accent)',fontSize:12}}>🔗 {m.mediaUrl}</a></div>}
            </div>
          </div>
        ))
      }
    </div>
  );
}

function AdminQuotesPage({quotes,setQuotes}){
  const[form,setForm]=useState({text:'',author:''});
  const[editing,setEditing]=useState(null);
  const[err,setErr]=useState('');
  function addQuote(){if(!form.text||!form.author){setErr('Both fields required.');return;}setQuotes(prev=>[...prev,{id:Date.now(),text:form.text,author:form.author,active:true}]);setForm({text:'',author:''});setErr('');}
  function toggleActive(id){setQuotes(prev=>prev.map(q=>q.id===id?{...q,active:!q.active}:q));}
  function deleteQuote(id){setQuotes(prev=>prev.filter(q=>q.id!==id));}
  function saveEdit(){setQuotes(prev=>prev.map(q=>q.id===editing.id?{...q,...editing}:q));setEditing(null);}
  return(
    <div>
      <div className="grid-2" style={{marginBottom:24}}>
        <div className="card">
          <div className="card-title" style={{marginBottom:14}}>Add New Quote</div>
          {err&&<div className="alert alert-warn">{err}</div>}
          <div className="form-group"><label>Quote Text</label><textarea value={form.text} onChange={e=>setForm(p=>({...p,text:e.target.value}))} placeholder="Enter the quote..."/></div>
          <div className="form-group"><label>Author</label><input value={form.author} onChange={e=>setForm(p=>({...p,author:e.target.value}))} placeholder="Author name"/></div>
          <button className="btn btn-primary" onClick={addQuote}>+ Add Quote</button>
        </div>
        <div className="card">
          <div className="card-title" style={{marginBottom:14}}>Stats</div>
          <div className="stat-card" style={{marginBottom:10}}><div className="stat-value">{quotes.length}</div><div className="stat-label">Total quotes</div></div>
          <div className="stat-card"><div className="stat-value">{quotes.filter(q=>q.active).length}</div><div className="stat-label">Active / visible</div></div>
        </div>
      </div>
      {editing&&(
        <div className="card" style={{marginBottom:16,borderColor:'var(--primary)',background:'var(--primary-light)'}}>
          <div className="card-title" style={{marginBottom:12}}>Editing Quote</div>
          <div className="form-group"><label>Quote Text</label><textarea value={editing.text} onChange={e=>setEditing(p=>({...p,text:e.target.value}))}/></div>
          <div className="form-group"><label>Author</label><input value={editing.author} onChange={e=>setEditing(p=>({...p,author:e.target.value}))}/></div>
          <div className="gap-2"><button className="btn btn-primary" onClick={saveEdit}>Save Changes</button><button className="btn btn-ghost" onClick={()=>setEditing(null)}>Cancel</button></div>
        </div>
      )}
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Quote</th><th>Author</th><th>Visible</th><th>Actions</th></tr></thead>
            <tbody>
              {quotes.map(q=>(
                <tr key={q.id}>
                  <td style={{maxWidth:300,fontStyle:'italic',fontSize:13}}>"{q.text.slice(0,80)}{q.text.length>80?'...':''}"</td>
                  <td style={{color:'var(--text-muted)',fontSize:13}}>{q.author}</td>
                  <td><span className={`badge ${q.active?'badge-approved':'badge-denied'}`}>{q.active?'Active':'Hidden'}</span></td>
                  <td><div className="gap-2"><button className="btn btn-ghost btn-sm" onClick={()=>setEditing({...q})}>Edit</button><button className="btn btn-ghost btn-sm" onClick={()=>toggleActive(q.id)}>{q.active?'Hide':'Show'}</button><button className="btn btn-danger btn-sm" onClick={()=>deleteQuote(q.id)}>Delete</button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<><CuteBg/><App/></>);
</script>
</body>
</html>
